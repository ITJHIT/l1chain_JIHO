name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (vet · build · test · race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -count=1 ./...
      # TEMPORARY: captures real per-test evidence for the m8 PoS redteam
      # report (same one-off pattern M6/M7's reports used) -- reverted in
      # this same PR before merge, does not appear in the merged workflow.
      - name: "TEMP: verbose evidence capture for M8 PoS adversarial tests"
        run: go test -v -count=1 -run 'TestAdvPoS|TestPoSWrongProposer|TestPoSDoubleProp|TestPoSDoubleAttest|TestPoSFinalitySafety' ./chain/
      - name: Race detector (concurrency-sensitive packages)
        # gcc is available on ubuntu runners, so -race (cgo) works here
        # even though it is unavailable in the pure-Go dev sandbox.
        run: go test -race -count=1 ./node/ ./p2p/

  web:
    name: Web (next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npx next build

  contracts:
    name: Contracts (solc compile + fixture drift check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install (pinned solc + OpenZeppelin)
        run: npm ci
      - name: Compile with pinned solc, refreeze
        run: |
          npm run compile
          npm run freeze
      # Proves both "real solc really compiled this" and "the checked-in
      # fixture is exactly reproducible" -- on every run, not a one-time
      # generation. See contracts/README.md.
      - name: Assert no drift between freshly-compiled bytecode and the checked-in fixture
        run: git diff --exit-code -- frozen/

  testnet:
    name: Multi-node testnet (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the 3-node compose demo
        run: docker compose up --build -d
      # Real end-to-end proof, not just "the compose file parses": three
      # separate containers, three separate libp2p hosts, real gossip and
      # real PoW mining, polled from OUTSIDE the compose network entirely
      # (plain curl against the host-mapped RPC ports) until they agree on
      # the same (height, hash) pair -- the same convergence property
      # cmd/l1/multiprocess_test.go's TestMultiprocessConvergence already
      # proves for 3 OS processes, here proved for 3 Docker containers
      # discovering each other via the docker/entrypoint.sh handshake
      # instead of a test harness handing them each other's addresses
      # directly.
      - name: Wait for all three nodes to converge on the same head
        timeout-minutes: 3
        run: |
          head() {
            curl -sf -m 2 -XPOST "$1" -d '{"jsonrpc":"2.0","id":1,"method":"getChainHead","params":[]}' \
              | jq -r '.result.height + ":" + .result.hash'
          }
          for i in $(seq 1 60); do
            H1=$(head http://localhost:8545 2>/dev/null) || H1=""
            H2=$(head http://localhost:8546 2>/dev/null) || H2=""
            H3=$(head http://localhost:8547 2>/dev/null) || H3=""
            echo "attempt $i: node1=$H1 node2=$H2 node3=$H3"
            if [ -n "$H1" ] && [ "$H1" = "$H2" ] && [ "$H1" = "$H3" ]; then
              HEIGHT="${H1%%:*}"
              if [ "$HEIGHT" -ge 2 ] 2>/dev/null; then
                echo "converged at $H1"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "nodes did not converge within the timeout"
          exit 1
      - name: Show node logs
        if: always()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
