name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (vet · build · test · race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Race detector (concurrency-sensitive packages)
        # gcc is available on ubuntu runners, so -race (cgo) works here
        # even though it is unavailable in the pure-Go dev sandbox.
        run: go test -race -count=1 ./node/ ./p2p/

  web:
    name: Web (next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npx next build
